name: onetimesecret_mobile
description: A secure Flutter mobile client for One-Time Secret (OTS)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # HTTP & Networking
  http: ^1.2.2

  # Dependency Injection
  get_it: ^7.6.0

  # State Management
  provider: ^6.1.2

  # JSON Serialization
  json_annotation: ^4.8.0

  # UI
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

  # Linting
  flutter_lints: ^3.0.0

  # Launcher Icons
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Assets
  # assets:
  #   - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0066CC"
  adaptive_icon_foreground: "assets/icon.png"
