name: onetimesecret_flutter
description: A security and privacy-first Flutter mobile application for OneTimeSecret
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.4

  # API & Networking
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  http_certificate_pinning: ^2.1.2
  connectivity_plus: ^6.1.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Security & Encryption
  crypto: ^3.0.5
  pointycastle: ^3.9.1
  encrypt: ^5.0.3

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  logger: ^2.4.0
  share_plus: ^10.1.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Code Obfuscation & Security
  freerasp: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  retrofit_generator: ^9.1.4
  json_serializable: ^6.8.0

  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  integration_test:
    sdk: flutter

  # Linting & Code Quality
  flutter_lints: ^4.0.0

  # Icon Generation
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/certificates/

  # Fonts
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
