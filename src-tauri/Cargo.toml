[package]
name = "onetimesecret-desktop"
version = "0.1.0"
description = "Secure desktop client for One-Time Secret"
authors = ["One-Time Secret Team"]
license = "MIT"
repository = "https://github.com/onetimesecret/ots1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = { version = "2.3", features = ["apple-native", "windows-native", "linux-native"] }
thiserror = "1.0"
rand = "0.8"

[features]
custom-protocol = ["tauri/custom-protocol"]
